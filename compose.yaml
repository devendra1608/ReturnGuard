services:
  postgres:
    image: postgres:17
    container_name: returnguard-postgres
    environment:
      POSTGRES_DB: returnguard
      POSTGRES_USER: returnguard
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - returnguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnguard -d returnguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  returnguard_postgres_data: